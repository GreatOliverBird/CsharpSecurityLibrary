<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Security Auditor Dashboard</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="container">
    <header>
        <h1>🔒 Security Auditor</h1>
        <div class="status-indicator">
            <span class="status-dot"></span>
            <span>Live Monitoring</span>
        </div>
    </header>

    <div class="stats-grid">
        <div class="stat-card">
            <h3>Total Findings</h3>
            <div id="totalFindings" class="stat-value">0</div>
        </div>
        <div class="stat-card">
            <h3>High Entropy</h3>
            <div id="highEntropy" class="stat-value">0</div>
        </div>
        <div class="stat-card">
            <h3>Keywords</h3>
            <div id="keywords" class="stat-value">0</div>
        </div>
        <div class="stat-card">
            <h3>Tokens</h3>
            <div id="tokens" class="stat-value">0</div>
        </div>
    </div>

    <div class="content">
        <div class="findings-header">
            <h2>Detected Strings</h2>
            <button id="refreshBtn" onclick="fetchFindings(); fetchStats();">Refresh</button>
        </div>
        <div id="findingsList" class="findings-list">
            <div class="empty-state">No findings yet...</div>
        </div>
    </div>
</div>

<script src="dashboard.js"></script>
</body>
</html>
